[package]
name = "a3-3005"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "3005a3"

[dependencies]
color-eyre = "0.6.5"
pound = "0.6.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "tokio-macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

non_primitive_cast = "allow"

absolute_paths = "deny"
allow_attributes = "forbid"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
# as_conversions = "warn"
assertions_on_result_states = "deny"
cfg_not_test = "forbid"
clone_on_ref_ptr = "deny"
dbg_macro = "warn"
# decimal_literal_representation = "warn"
# default_union_representation = "deny"
deref_by_slicing = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
enum_glob_use = "deny"
error_impl_error = "warn"
# exit = "forbid"
expect_used = "warn"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
# float_cmp_const = "deny"
# fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "forbid"
indexing_slicing = "warn"
infinite_loop = "deny"
# integer_division = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "deny"
# lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "deny"
# mem_forget = "deny"
min_ident_chars = "deny"
missing_assert_message = "deny"
missing_docs_in_private_items = "warn"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "forbid"
multiple_inherent_impl = "warn"
# multiple_unsafe_ops_per_block = "forbid"
# mutex_atomic = "warn"
# mutex_integer = "warn"
# needless_raw_strings = "warn"
non_zero_suggestions = "warn"
panic = "warn"
# panic = { level = "warn", allow-panic-in-tests = true }
panic_in_result_fn = "deny"
partial_pub_fields = "warn"
pathbuf_init_then_push = "deny"
precedence_bits = "warn"
pub_with_shorthand = "warn"
# rc_buffer = "warn"
# rc_muttex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "warn"
# ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "warn"
self_named_module_files = "forbid"
semicolon_inside_block = "deny"
shadow_unrelated = "warn"
single_call_fn = "warn"
single_char_lifetime_names = "deny"
str_to_string = "warn"
string_add = "warn"
tests_outside_test_module = "forbid"
todo = "warn"
try_err = "deny"
# undocumented_unsafe_blocks = "forbid"
# unimplemented = "warn"
# unnecessary_safety_comment = "warn"
# unnecessary_safety_doc = "warn"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "warn"
unseparated_literal_suffix = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "warn"
verbose_file_reads = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

